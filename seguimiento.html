<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento · TPM Tornquist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
/* ─── ESTILOS DE IMPRESIÓN ─── */
@media print {
  body { background:#fff!important; margin:0; font-size:11pt }
  /* ocultar TODA la pantalla (barra, titulo, filtros, tabla, modal) */
  .topbar, .wrap, .modal-bg { display:none!important }
  /* mostrar solo la hoja a imprimir */
  #printArea { display:block!important; padding:0!important }
  #printArea table { font-size:9.5pt }
  #printArea th { background:#548235!important; color:#fff!important }
  /* respetar colores de badges, encabezados y celdas marcadas */
  #printArea * { -webkit-print-color-adjust:exact; print-color-adjust:exact }
  @page { margin:14mm }
}
.print-solo { display:none }
/* hoja de reporte individual */
.orden-print { font-family:Arial,sans-serif; max-width:780px; margin:0 auto }
.orden-header { display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid #548235; padding-bottom:12px; margin-bottom:16px }
.orden-brand { font-size:13px; color:#3D5F26; font-weight:bold }
.orden-id { font-size:28px; font-weight:bold; font-family:monospace; color:#263528 }
.orden-badge { display:inline-block; color:#fff; font-weight:bold; font-size:13px; padding:5px 14px; border-radius:20px; margin:4px 4px 0 0 }
.orden-section { margin:14px 0 }
.orden-section h3 { font-size:11px; font-weight:bold; color:#3D5F26; letter-spacing:1px; text-transform:uppercase; margin:0 0 4px; border-bottom:1px solid #D7DECC; padding-bottom:3px }
.orden-section p { margin:4px 0; font-size:13px; color:#2B362C; line-height:1.5 }
.orden-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px }
.orden-foto { max-width:100%; max-height:200px; border-radius:8px; border:1px solid #D7DECC; margin-top:8px }
.firma-box { border:1px solid #D7DECC; border-radius:6px; padding:14px; margin-top:10px; min-height:60px }
.firma-label { font-size:10px; color:#6E7A6C; margin-bottom:6px }
.lista-print { font-family:Arial,sans-serif }
.lista-header { display:flex; justify-content:space-between; border-bottom:3px solid #548235; padding-bottom:10px; margin-bottom:14px }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Tarjetas TPM · Tornquist</div>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="formulario.html">Cargar</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="seguimiento.html" class="activo">Seguimiento</a>
    <a href="como-funciona.html">Cómo funciona</a>
    <span id="flag"></span>
  </nav>
</div>

<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <div><h1>Seguimiento</h1><p class="sub">Filtra, asigna responsables y cierra cada tarjeta.</p></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sec sm no-print" id="impLista">🖨 Imprimir lista</button>
      <button class="btn sec sm no-print" id="exportar">Exportar CSV</button>
      <button class="btn sec sm no-print" id="recargar">Actualizar</button>
    </div>
  </div>

  <div id="msg"></div>

  <div class="card">
    <div class="filtros">
      <div><label>Color</label><select id="fColor"><option value="">Todos</option><option>Roja</option><option>Azul</option><option>Verde</option></select></div>
      <div><label>Estado</label><select id="fEstado"><option value="">Todos</option><option>Abierta</option><option>En proceso</option><option>Cerrada</option><option>Anulada</option></select></div>
      <div><label>Grupo</label><select id="fGrupo"><option value="">Todos</option><option>Mantenimiento</option><option>Operacion</option><option>Mejora Enfocada</option></select></div>
      <div><label>Área equipo</label><select id="fArea"><option value="">Todas</option></select></div>
      <div><label>Etapa MA</label><select id="fEtapa"><option value="">Todas</option></select></div>
      <div><label>Buscar</label><input id="fTexto" placeholder="ID, equipo, texto..."></div>
      <div style="flex:0"><label>&nbsp;</label><label style="font-weight:normal;font-size:12px;color:var(--ink)"><input type="checkbox" id="fVencidas" style="width:auto;margin-right:6px">Solo vencidas</label></div>
    </div>
    <div style="overflow:auto;max-height:62vh">
      <table>
        <thead><tr>
          <th>ID</th><th>Color</th><th>Ubicación</th><th>Descripcion</th>
          <th>Grupo</th><th>Responsable</th><th>Dias</th><th>Estado</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <p class="sub" id="conteo" style="margin-top:10px"></p>
  </div>
</div><!-- end wrap -->

<!-- ═══════════ ÁREA DE IMPRESIÓN (oculta en pantalla) ═══════════ -->
<div id="printArea" class="print-solo" style="padding:20px"></div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div><h3 id="mTitulo"></h3><div id="mBadges" style="margin:6px 0"></div></div>
      <button class="btn sec sm" id="mCerrarX">✕</button>
    </div>
    <div id="mDetalle"></div>

    <h2 style="font-size:14px">Gestion</h2>
    <div class="grid cols-2">
      <div><label>Responsable asignado</label><select id="gResponsable"></select></div>
      <div><label>Fecha compromiso</label><input id="gCompromiso" type="date"></div>
    </div>
    <div class="grid cols-2">
      <div><label>Estado</label><select id="gEstado"></select></div>
      <div><label>Prioridad</label><select id="gPrioridad"></select></div>
    </div>
    <label>Etapa de Mantenimiento Autonomo</label>
    <select id="gEtapaMa"></select>
    <label>Nota</label>
    <textarea id="gNotas"></textarea>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn" id="gGuardar">Guardar cambios</button>
    </div>

    <h2 style="font-size:14px">Cerrar tarjeta</h2>
    <label>Accion de cierre (que se hizo)</label>
    <textarea id="gAccionCierre" placeholder="Como se resolvio."></textarea>
    <div class="grid cols-2">
      <div><label>Costo / ahorro (USD)</label><input id="gCosto" type="number"></div>
      <div style="display:flex;align-items:flex-end"><button class="btn" id="gCerrar" style="width:100%">Marcar como cerrada</button></div>
    </div>
  </div>
</div>

<script src="arbol.js"></script>
<script src="personas.js"></script>
<script src="comun.js"></script>
<script>
  /* badge demo removido a pedido */
  var TODAS = [], actual = null;

  document.getElementById('fEtapa').innerHTML = '<option value="">Todas</option>' + opciones(ETAPAS_MA);
  document.getElementById('fArea').innerHTML = '<option value="">Todas</option>' + opciones(Object.keys(ARBOL_EQUIPO));
  document.getElementById('gEstado').innerHTML = opciones(ESTADOS);
  document.getElementById('gPrioridad').innerHTML = opciones(PRIORIDADES);
  document.getElementById('gEtapaMa').innerHTML = '<option value="">—</option>' + opciones(ETAPAS_MA);
  document.getElementById('gResponsable').innerHTML = '<option value="">(sin asignar)</option>' + opcionesGrupos(PERSONAS_POR_SECTOR);

  function msg(t,ok){ document.getElementById('msg').innerHTML='<div class="msg '+(ok?'ok':'err')+'">'+t+'</div>'; window.scrollTo(0,0); }

  async function cargar(){
    try{
      var r = await api('listar');
      if(!r.ok){ msg(r.error||'error', false); return; }
      TODAS = r.tarjetas; render();
    }catch(e){ msg('Error de conexion: '+e.message, false); }
  }

  function filtradas(){
    var c=document.getElementById('fColor').value, e=document.getElementById('fEstado').value,
        g=document.getElementById('fGrupo').value,
        et=document.getElementById('fEtapa').value, fa=document.getElementById('fArea').value,
        tx=document.getElementById('fTexto').value.toLowerCase(), v=document.getElementById('fVencidas').checked;
    return TODAS.filter(function(t){
      if(c && t['Tipo']!==c) return false;
      if(e && t['Estado']!==e) return false;
      if(g && t['Grupo responsable']!==g) return false;
      if(et && t['Etapa MA']!==et) return false;
      if(fa && t['Area equipo']!==fa) return false;
      if(v && !t.vencida) return false;
      if(tx){ var blob=(t['ID']+' '+t['Equipo']+' '+t['Descripcion']+' '+t['Responsable asignado']+' '+t['Componente/Ubicacion']).toLowerCase(); if(blob.indexOf(tx)===-1) return false; }
      return true;
    });
  }

  function render(){
    var f = filtradas();
    document.getElementById('tbody').innerHTML = f.map(function(t){
      return '<tr class="clic" data-id="'+esc(t['ID'])+'">'+
        '<td style="font-family:monospace;font-size:12px">'+esc(t['ID'])+'</td>'+
        '<td>'+badgeTipo(t['Tipo'])+'</td>'+
        '<td>'+esc(t['Area equipo']||'—')+(t['Equipo']?'<br><span style="color:var(--muted);font-size:12px">'+esc(t['Equipo'])+(t['Componente/Ubicacion']?' › '+esc(t['Componente/Ubicacion']):'')+'</span>':'')+'</td>'+
        '<td>'+esc(String(t['Descripcion']).slice(0,70))+(String(t['Descripcion']).length>70?'…':'')+'</td>'+
        '<td>'+esc(t['Grupo responsable'])+'</td>'+
        '<td>'+esc(t['Responsable asignado']||'—')+'</td>'+
        '<td style="text-align:center">'+(t.diasAbierta===''?'—':t.diasAbierta)+'</td>'+
        '<td>'+badgeEstado(t['Estado'], t.vencida)+'</td></tr>';
    }).join('');
    document.getElementById('conteo').textContent = f.length + ' de ' + TODAS.length + ' tarjetas';
    Array.prototype.forEach.call(document.querySelectorAll('#tbody tr'), function(tr){
      tr.addEventListener('click', function(){ abrir(tr.getAttribute('data-id')); });
    });
  }

  function abrir(id){
    actual = TODAS.find(function(t){ return t['ID']===id; });
    if(!actual) return;
    var t = actual;
    document.getElementById('mTitulo').textContent = t['ID'];
    document.getElementById('mBadges').innerHTML = badgeTipo(t['Tipo']) + ' ' + badgeEstado(t['Estado'], t.vencida);
    document.getElementById('mDetalle').innerHTML =
      '<div class="kv"><b>Ubicación:</b> '+esc(t['Area equipo']||'—')+' › '+esc(t['Equipo']||'—')+(t['Componente/Ubicacion']?' › '+esc(t['Componente/Ubicacion']):'')+'</div>'+
      '<div class="kv"><b>Categoria:</b> '+esc(t['Categoria']||'—')+' &nbsp; <b>Prioridad:</b> '+esc(t['Prioridad'])+'</div>'+
      '<div class="kv"><b>Etapa MA:</b> '+esc(t['Etapa MA']||'—')+(t['Dimension mejora']?' &nbsp; <b>Mejora:</b> '+esc(t['Dimension mejora']):'')+'</div>'+
      '<div class="kv"><b>Detectado por:</b> '+esc(t['Detectado por'])+' ('+esc(t['Turno']||'s/turno')+') &nbsp; <b>Alta:</b> '+esc(t['Fecha alta'])+'</div>'+
      '<div class="kv"><b>Grupo responsable:</b> '+esc(t['Grupo responsable'])+'</div>'+
      '<div class="kv" style="margin-top:6px"><b>Descripcion:</b> '+esc(t['Descripcion'])+'</div>'+
      (t['Accion de cierre']?'<div class="kv" style="margin-top:6px"><b>Cierre:</b> '+esc(t['Accion de cierre'])+' ('+esc(t['Fecha cierre'])+')</div>':'')+
      (t['Foto URL']?'<div style="margin-top:8px"><a href="'+esc(t['Foto URL'])+'" target="_blank"><img src="'+esc(t['Foto URL'])+'" style="max-height:140px;border-radius:8px;border:1px solid var(--line)"></a></div>':'');
    document.getElementById('gResponsable').value = t['Responsable asignado']||'';
    document.getElementById('gCompromiso').value = (t['Fecha compromiso']||'').slice(0,10);
    document.getElementById('gEstado').value = t['Estado'];
    document.getElementById('gPrioridad').value = t['Prioridad']||'Media';
    document.getElementById('gEtapaMa').value = t['Etapa MA']||'';
    document.getElementById('gNotas').value = t['Notas']||'';
    document.getElementById('gAccionCierre').value = '';
    document.getElementById('gCosto').value = t['Costo estimado']||'';
    document.getElementById('modal').classList.add('show');
  }
  function cerrarModal(){ document.getElementById('modal').classList.remove('show'); }

  document.getElementById('mCerrarX').addEventListener('click', cerrarModal);
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target.id==='modal') cerrarModal(); });

  document.getElementById('gGuardar').addEventListener('click', async function(){
    if(!actual) return;
    var cambios = {
      responsable: document.getElementById('gResponsable').value.trim(),
      fechaCompromiso: document.getElementById('gCompromiso').value,
      estado: document.getElementById('gEstado').value,
      prioridad: document.getElementById('gPrioridad').value,
      etapaMa: document.getElementById('gEtapaMa').value,
      notas: document.getElementById('gNotas').value.trim()
    };
    try{ var r = await api('actualizar', { id: actual['ID'], cambios: cambios });
      if(r.ok){ cerrarModal(); msg('Tarjeta '+actual['ID']+' actualizada.', true); cargar(); }
      else msg(r.error||'error', false);
    }catch(e){ msg('Error: '+e.message, false); }
  });

  document.getElementById('gCerrar').addEventListener('click', async function(){
    if(!actual) return;
    var accion = document.getElementById('gAccionCierre').value.trim();
    if(!accion) return msg('Indica la accion de cierre.', false);
    try{ var r = await api('cerrar', { id: actual['ID'], accion: accion, costo: document.getElementById('gCosto').value });
      if(r.ok){ cerrarModal(); msg('Tarjeta '+actual['ID']+' cerrada.', true); cargar(); }
      else msg(r.error||'error', false);
    }catch(e){ msg('Error: '+e.message, false); }
  });

  ['fColor','fEstado','fGrupo','fEtapa','fArea','fVencidas'].forEach(function(id){ document.getElementById(id).addEventListener('change', render); });
  document.getElementById('fTexto').addEventListener('input', render);
  document.getElementById('recargar').addEventListener('click', cargar);

  /* ═══════════════ IMPRESIÓN ═══════════════ */

  function colorBadge(tipo){return '<span class="orden-badge" style="background:'+colorTipo(tipo)+'">'+esc(tipo)+'</span>';}
  function estadoBadge(t){
    var col=t['Estado']==='Cerrada'?'#639922':t['Estado']==='En proceso'?'#C77D11':'#2D6CB5';
    return '<span class="orden-badge" style="background:'+col+'">'+esc(t['Estado'])+'</span>';
  }
  function ubicacion(t){
    var u=esc(t['Area equipo']||'');
    if(t['Equipo']) u+=(u?' › ':'')+esc(t['Equipo']);
    if(t['Componente/Ubicacion']) u+=' › '+esc(t['Componente/Ubicacion']);
    return u||'—';
  }
  function fmtFecha(v){ return v?String(v).slice(0,16):'—'; }

  /* ── ORDEN INDIVIDUAL ── */
  function htmlOrden(t){
    var foto=t['Foto URL']&&t['Foto URL'].startsWith('data:')?'<img class="orden-foto" src="'+t['Foto URL']+'">':
             t['Foto URL']?'<p style="font-size:12px;color:#2D6CB5"><a href="'+esc(t['Foto URL'])+'">Ver foto adjunta</a></p>':'<p style="color:#999;font-size:12px">Sin foto</p>';
    var ahora=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
    return `
<div class="orden-print">
  <div class="orden-header">
    <div>
      <div class="orden-brand">ORDEN DE TRABAJO TPM — Planta Tornquist</div>
      <div class="orden-id">${esc(t['ID'])}</div>
      <div style="margin-top:8px">${colorBadge(t['Tipo'])} ${estadoBadge(t)}</div>
    </div>
    <div style="text-align:right;font-size:11px;color:#6E7A6C">
      <div>Impreso: ${ahora}</div>
      <div style="margin-top:4px">Alta: ${fmtFecha(t['Fecha alta'])}</div>
      <div style="margin-top:4px;font-size:15px;font-weight:bold;color:#C0392B">${t.vencida?'⚠ VENCIDA':''}</div>
    </div>
  </div>

  <div class="orden-grid">
    <div class="orden-section">
      <h3>Ubicación del equipo</h3>
      <p style="font-weight:bold">${ubicacion(t)}</p>
    </div>
    <div class="orden-section">
      <h3>Categoría y etapa</h3>
      <p><b>Categoría:</b> ${esc(t['Categoria']||'—')}</p>
      <p><b>Etapa MA:</b> ${esc(t['Etapa MA']||'—')}</p>
      <p><b>Prioridad:</b> ${esc(t['Prioridad']||'—')}</p>
    </div>
  </div>

  <div class="orden-section">
    <h3>Descripción de la anomalía o mejora</h3>
    <p style="background:#F3F6EE;padding:10px;border-radius:6px;min-height:48px">${esc(t['Descripcion']||'')}</p>
  </div>

  <div class="orden-grid">
    <div class="orden-section">
      <h3>Responsable asignado</h3>
      <p style="font-size:16px;font-weight:bold">${esc(t['Responsable asignado']||'Sin asignar')}</p>
      <p>Grupo: ${esc(t['Grupo responsable']||'—')}</p>
    </div>
    <div class="orden-section">
      <h3>Fechas</h3>
      <p><b>Detectado por:</b> ${esc(t['Detectado por']||'—')} (Turno ${esc(t['Turno']||'—')})</p>
      <p><b>Fecha compromiso:</b> <span style="color:${t.vencida?'#C0392B':'inherit'};font-weight:${t.vencida?'bold':'normal'}">${esc(t['Fecha compromiso']||'—')}</span></p>
      <p><b>Días abierta:</b> ${t.diasAbierta!==''?t.diasAbierta:'—'} días</p>
    </div>
  </div>

  <div class="orden-section">
    <h3>Foto</h3>
    ${foto}
  </div>

  ${t['Notas']?`<div class="orden-section"><h3>Notas</h3><p>${esc(t['Notas'])}</p></div>`:''}

  ${t['Estado']==='Cerrada'?`
  <div class="orden-section" style="background:#EAF3DE;padding:10px;border-radius:6px">
    <h3>Acción de cierre</h3>
    <p>${esc(t['Accion de cierre']||'')}</p>
    <p style="font-size:11px;color:#6E7A6C">Fecha cierre: ${fmtFecha(t['Fecha cierre'])} ${t['Costo estimado']?'· Costo: USD '+esc(t['Costo estimado']):''}</p>
  </div>`:`
  <div class="orden-section">
    <h3>Acción realizada (completar al resolver)</h3>
    <div class="firma-box">
      <div class="firma-label">Describir qué se hizo, materiales usados, tiempo empleado:</div>
    </div>
  </div>
  <div class="orden-grid" style="margin-top:14px">
    <div class="firma-box"><div class="firma-label">Firma responsable / fecha resolución</div></div>
    <div class="firma-box"><div class="firma-label">Visto bueno supervisor</div></div>
  </div>`}
</div>`;
  }

  /* ── LISTA DE PENDIENTES ── */
  function htmlLista(ts){
    var ahora=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    var filtActivos=[];
    ['fColor','fEstado','fGrupo','fEtapa','fArea'].forEach(function(id){
      var el=document.getElementById(id); if(el&&el.value) filtActivos.push(el.options[el.selectedIndex].text+'='+el.value);
    });
    if(document.getElementById('fVencidas').checked) filtActivos.push('Solo vencidas');
    var filas=ts.map(function(t){
      var ubic=t['Area equipo']?esc(t['Area equipo'])+(t['Equipo']?' › '+esc(t['Equipo']):''):'—';
      var comp=t['Componente/Ubicacion']?'<br><span style="font-size:9px;color:#6E7A6C">'+esc(t['Componente/Ubicacion'])+'</span>':'';
      var vTag=t.vencida?'<span style="color:#C0392B;font-weight:bold"> ⚠</span>':'';
      return `<tr style="border-bottom:1px solid #D7DECC;${t.vencida?'background:#FEF5F5':''}">
        <td style="padding:5px 6px;font-family:monospace;font-size:8.5pt;white-space:nowrap">${esc(t['ID'])}</td>
        <td style="padding:5px 6px"><span style="background:${colorTipo(t['Tipo'])};color:#fff;padding:2px 8px;border-radius:10px;font-size:8pt;font-weight:bold">${esc(t['Tipo'])}</span></td>
        <td style="padding:5px 6px;font-size:9pt">${esc(t['Area equipo']||'—')}</td>
        <td style="padding:5px 6px;font-size:9pt">${ubic}${comp}</td>
        <td style="padding:5px 6px;font-size:9pt;max-width:220px">${esc(t['Descripcion']||'').slice(0,90)}${(t['Descripcion']||'').length>90?'…':''}</td>
        <td style="padding:5px 6px;font-size:9pt">${esc(t['Prioridad']||'—')}</td>
        <td style="padding:5px 6px;font-size:9pt">${esc(t['Responsable asignado']||'—')}</td>
        <td style="padding:5px 6px;font-size:9pt;white-space:nowrap;color:${t.vencida?'#C0392B':'inherit'};font-weight:${t.vencida?'bold':'normal'}">${esc(t['Fecha compromiso']||'—')}${vTag}</td>
        <td style="padding:5px 6px;text-align:center;font-size:9pt">${t.diasAbierta!==''?t.diasAbierta:'—'}</td>
        <td style="padding:5px 6px;min-width:80px;border-left:1px dashed #ccc"></td>
      </tr>`;
    }).join('');
    return `
<div class="lista-print">
  <div class="lista-header">
    <div>
      <div style="font-size:11px;font-weight:bold;color:#3D5F26;letter-spacing:1px">LISTA DE PENDIENTES TPM — Planta Tornquist</div>
      <div style="font-size:20px;font-weight:bold;color:#263528;margin-top:2px">Tarjetas abiertas · ${ts.length} registro${ts.length!==1?'s':''}</div>
      ${filtActivos.length?'<div style="font-size:10px;color:#6E7A6C;margin-top:4px">Filtros: '+filtActivos.join(' · ')+'</div>':''}
    </div>
    <div style="text-align:right;font-size:10px;color:#6E7A6C">
      <div>Impreso: ${ahora}</div>

  // Imprimir lista (respeta filtros activos)
  document.getElementById('impLista').addEventListener('click', function(){
    var f = filtradas();
    if(!f.length){ msg('No hay tarjetas con los filtros actuales.', false); return; }
    document.getElementById('printArea').innerHTML = htmlLista(f);
    window.print();
  });

  // Imprimir orden individual (desde el modal)
  document.getElementById('gGuardar').insertAdjacentHTML('afterend',
    '<button class="btn sec sm no-print" id="impOrden" style="margin-left:8px">🖨 Imprimir orden</button>');
  document.addEventListener('click', function(e){
    if(e.target.id==='impOrden' && actual){
      document.getElementById('printArea').innerHTML = htmlOrden(actual);
      window.print();
    }
  });

  document.getElementById('exportar').addEventListener('click', function(){
    var cols=['ID','Fecha alta','Tipo','Grupo responsable','Detectado por','Turno','Area equipo','Equipo','Componente/Ubicacion','Categoria','Etapa MA','Dimension mejora','Descripcion','Prioridad','Responsable asignado','Fecha compromiso','Estado','Fecha cierre','Accion de cierre','Costo estimado'];
    var datos=filtradas();
    if(!datos.length){ msg('No hay tarjetas para exportar con los filtros actuales.', false); return; }
    var q=function(v){ v=String(v==null?'':v).replace(/"/g,'""'); return '"'+v+'"'; };
    var csv=cols.map(q).join(',')+'\r\n'+datos.map(function(t){ return cols.map(function(c){return q(t[c]);}).join(','); }).join('\r\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='tarjetas_tpm_'+hoyISO()+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  });
  cargar();
</script>
