<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar tarjeta · TPM Tornquist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="topbar">
  <div class="brand">Tarjetas TPM · Tornquist</div>
  <nav>
    <a href="index.html">Inicio</a>
    <a href="formulario.html" class="activo">Cargar</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="seguimiento.html">Seguimiento</a>
    <a href="como-funciona.html">Cómo funciona</a>
    <span id="flag"></span>
  </nav>
</div>

<div class="wrap" style="max-width:820px">
  <h1>Cargar tarjeta</h1>
  <p class="sub">Elegi el color: define quien la resuelve. Detectar a tiempo es mantener — cada tarjeta cuenta.</p>

  <div id="msg"></div>

  <div class="card">
    <label>Tipo de tarjeta</label>
    <div class="tipos" id="tipos"></div>
    <div id="grupoInfo" class="kv" style="margin-top:8px"></div>

    <div class="grid cols-2">
      <div>
        <label>Detectado por (quien carga) *</label>
        <select id="detectadoPor"></select>
      </div>
      <div>
        <label>Turno</label>
        <select id="turno"><option value="">—</option></select>
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label>Área (equipo) *</label>
        <select id="areaEquipo"><option value="">Elegir área...</option></select>
      </div>
      <div>
        <label>Subárea / equipo *</label>
        <select id="equipo" disabled><option value="">Primero elegí el área</option></select>
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label id="lblN3">Equipo específico</label>
        <select id="componente" disabled><option value="">Primero elegí la subárea</option></select>
      </div>
      <div>
        <label id="lblCat">Categoria de anomalia (TPM)</label>
        <select id="categoria"></select>
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label>Etapa de Mantenimiento Autonomo</label>
        <select id="etapaMa"></select>
      </div>
      <div id="boxDim" style="display:none">
        <label>Dimension de la mejora</label>
        <select id="dimensionMejora"></select>
      </div>
    </div>

    <label>Descripcion de la anomalia o mejora *</label>
    <textarea id="descripcion" placeholder="Que se detecto, donde y desde cuando."></textarea>

    <div class="grid cols-3">
      <div>
        <label>Prioridad</label>
        <select id="prioridad"></select>
      </div>
      <div>
        <label>Responsable asignado</label>
        <select id="responsable"></select>
      </div>
      <div>
        <label>Fecha compromiso</label>
        <input id="fechaCompromiso" type="date">
      </div>
    </div>

    <div class="grid cols-2">
      <div>
        <label>Foto (sacar o adjuntar)</label>
        <input id="foto" type="file" accept="image/*" capture="environment">
        <div id="fotoPrev"></div>
      </div>
      <div id="boxCosto" style="display:none">
        <label>Costo / ahorro estimado (USD)</label>
        <input id="costo" type="number" placeholder="(opcional) para arbol de perdidas">
      </div>
    </div>

    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="btn" id="guardar" disabled>Guardar tarjeta</button>
      <button class="btn sec" id="limpiar">Limpiar</button>
    </div>
  </div>
</div>

<script src="arbol.js"></script>
<script src="personas.js"></script>
<script src="comun.js"></script>
<script>
  /* badge demo removido a pedido */
  var tipoSel = '';

  document.getElementById('turno').innerHTML = '<option value="">—</option>' + opciones(TURNOS);
  document.getElementById('areaEquipo').innerHTML = '<option value="">Elegir área...</option>' + opciones(Object.keys(ARBOL_EQUIPO));

  // arbol encadenado: Area -> Subarea/Equipo -> Equipo especifico
  document.getElementById('areaEquipo').addEventListener('change', function(){
    var eq = document.getElementById('equipo'), n3 = document.getElementById('componente');
    n3.innerHTML = '<option value="">Primero elegí la subárea</option>'; n3.disabled = true;
    if (!this.value) { eq.innerHTML = '<option value="">Primero elegí el área</option>'; eq.disabled = true; return; }
    eq.innerHTML = '<option value="">Elegir subárea / equipo...</option>' + opciones(Object.keys(ARBOL_EQUIPO[this.value]));
    eq.disabled = false;
  });
  document.getElementById('equipo').addEventListener('change', function(){
    var area = document.getElementById('areaEquipo').value, n3 = document.getElementById('componente');
    var hijos = (area && this.value) ? (ARBOL_EQUIPO[area][this.value] || []) : [];
    if (hijos.length) {
      n3.innerHTML = '<option value="">Elegir equipo...</option>' + opciones(hijos);
      n3.disabled = false;
      document.getElementById('lblN3').textContent = 'Equipo específico *';
    } else {
      n3.innerHTML = '<option value="">(la subárea es el equipo)</option>';
      n3.disabled = true;
      document.getElementById('lblN3').textContent = 'Equipo específico';
    }
  });
  document.getElementById('detectadoPor').innerHTML = '<option value="">Elegir persona...</option>' + opcionesGrupos(PERSONAS_POR_SECTOR);
  document.getElementById('responsable').innerHTML = '<option value="">(opcional) elegir persona...</option>' + opcionesGrupos(PERSONAS_POR_SECTOR);
  document.getElementById('prioridad').innerHTML = opciones(PRIORIDADES, 'Media');
  document.getElementById('categoria').innerHTML = '<option value="">—</option>' + opcionesGrupos(CATEGORIAS_TPM);
  document.getElementById('etapaMa').innerHTML = '<option value="">—</option>' + opciones(ETAPAS_MA);
  document.getElementById('dimensionMejora').innerHTML = '<option value="">—</option>' + opciones(DIMENSIONES_MEJORA);
  document.getElementById('fechaCompromiso').value = '';

  document.getElementById('tipos').innerHTML = Object.keys(TIPOS).map(function(k){
    var t = TIPOS[k];
    return '<div class="tipo" data-t="'+k+'"><div class="cab" style="background:'+t.color+'">Tarjeta '+k+'</div><div class="d">'+t.desc+'</div></div>';
  }).join('');

  // sugerir la etapa de MA segun el grupo (optgroup) de la categoria elegida
  document.getElementById('categoria').addEventListener('change', function(){
    var opt = this.options[this.selectedIndex];
    var grupo = opt && opt.parentNode && opt.parentNode.label ? opt.parentNode.label : '';
    var sug = ETAPA_SUGERIDA[grupo];
    if (sug && !document.getElementById('etapaMa').value) document.getElementById('etapaMa').value = sug;
  });

  Array.prototype.forEach.call(document.querySelectorAll('.tipo'), function(el){
    el.addEventListener('click', function(){
      tipoSel = el.getAttribute('data-t');
      Array.prototype.forEach.call(document.querySelectorAll('.tipo'), function(x){ x.classList.remove('sel'); });
      el.classList.add('sel');
      var g = TIPOS[tipoSel].grupo;
      document.getElementById('grupoInfo').innerHTML = 'Responsable automatico: <b>' + g + '</b>';
      document.getElementById('guardar').disabled = false;
      // costo y dimension de mejora solo para verde
      document.getElementById('boxCosto').style.display = (tipoSel === 'Verde') ? 'block' : 'none';
      document.getElementById('boxDim').style.display = (tipoSel === 'Verde') ? 'block' : 'none';
    });
  });

  var fotoDataURL = '';
  document.getElementById('foto').addEventListener('change', async function(){
    var f = this.files[0];
    if(!f){ fotoDataURL=''; document.getElementById('fotoPrev').innerHTML=''; return; }
    document.getElementById('fotoPrev').innerHTML = '<span style="font-size:12px;color:var(--muted)">Procesando imagen...</span>';
    try{
      fotoDataURL = await comprimirImagen(f);
      document.getElementById('fotoPrev').innerHTML = '<img src="'+fotoDataURL+'" style="max-height:90px;margin-top:6px;border-radius:6px;border:1px solid var(--line)">';
    }catch(e){ fotoDataURL=''; document.getElementById('fotoPrev').innerHTML='<span style="font-size:12px;color:#A32D2D">No se pudo cargar la imagen</span>'; }
  });

  function msg(txt, ok){ document.getElementById('msg').innerHTML = '<div class="msg '+(ok?'ok':'err')+'">'+txt+'</div>'; window.scrollTo(0,0); }

  function limpiarCampos(){
    ['detectadoPor','descripcion','responsable','costo','areaEquipo'].forEach(function(id){ document.getElementById(id).value=''; });
    document.getElementById('equipo').innerHTML = '<option value="">Primero elegí el área</option>'; document.getElementById('equipo').disabled = true;
    document.getElementById('componente').innerHTML = '<option value="">Primero elegí la subárea</option>'; document.getElementById('componente').disabled = true;
    document.getElementById('lblN3').textContent = 'Equipo específico';
    document.getElementById('foto').value=''; document.getElementById('fotoPrev').innerHTML=''; fotoDataURL='';
  }
  document.getElementById('limpiar').addEventListener('click', function(){
    limpiarCampos();
    document.getElementById('msg').innerHTML='';
  });

  document.getElementById('guardar').addEventListener('click', async function(){
    if (!tipoSel) return msg('Elegi el tipo de tarjeta.', false);
    var data = {
      tipo: tipoSel,
      detectadoPor: document.getElementById('detectadoPor').value.trim(),
      turno: document.getElementById('turno').value,
      areaEquipo: document.getElementById('areaEquipo').value,
      equipo: document.getElementById('equipo').value,
      componente: document.getElementById('componente').value,
      categoria: document.getElementById('categoria').value,
      descripcion: document.getElementById('descripcion').value.trim(),
      prioridad: document.getElementById('prioridad').value,
      responsable: document.getElementById('responsable').value.trim(),
      fechaCompromiso: document.getElementById('fechaCompromiso').value,
      fotoData: fotoDataURL,
      costo: document.getElementById('costo').value,
      etapaMa: document.getElementById('etapaMa').value,
      dimensionMejora: document.getElementById('dimensionMejora').value
    };
    if (!data.detectadoPor || !data.descripcion) return msg('Completa los campos obligatorios (*).', false);
    if (!data.areaEquipo || !data.equipo) return msg('Elegi el área y la subárea/equipo del árbol.', false);
    var hijosN3 = (ARBOL_EQUIPO[data.areaEquipo][data.equipo] || []);
    if (hijosN3.length && !data.componente) return msg('Elegi el equipo específico (tercer nivel).', false);
    var btn = document.getElementById('guardar'); btn.disabled = true; btn.textContent = 'Guardando...';
    try {
      var r = await api('crear', { data: data });
      if (r.ok) {
        msg('Tarjeta <b>' + r.id + '</b> creada y asignada a <b>' + r.grupo + '</b>.', true);
        limpiarCampos();
      } else { msg('Error: ' + (r.error || 'no se pudo guardar'), false); }
    } catch (e) { msg('Error de conexion: ' + e.message, false); }
    btn.disabled = false; btn.textContent = 'Guardar tarjeta';
  });
</script>
</body>
</html>
