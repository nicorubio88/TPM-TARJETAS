<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Examen · TPM Tornquist</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#548235">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  .wrap.ex{max-width:760px}
  .preg{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
  .preg .n{font-size:12px;font-weight:800;color:var(--verde);letter-spacing:.06em;text-transform:uppercase}
  .preg .t{font-size:16.5px;font-weight:700;margin:6px 0 12px;line-height:1.35}
  .op{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:14.5px;line-height:1.35;background:#fff}
  .op input{margin-top:3px;accent-color:var(--verde);width:18px;height:18px;flex:none}
  .op.sel{border-color:var(--verde);background:var(--verde-soft)}
  .op.bien{border-color:var(--verdetag);background:var(--verde-soft)}
  .op.mal{border-color:var(--roja);background:var(--roja-soft)}
  .expl{font-size:13.5px;line-height:1.45;color:var(--ink);background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:8px}
  .expl b.ok{color:var(--verde-d)} .expl b.no{color:var(--roja-ink)}
  .barra{position:sticky;bottom:0;background:rgba(245,248,240,.96);padding:12px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line)}
  .nota{text-align:center;padding:26px 16px}
  .nota .big{font-size:56px;font-weight:800;color:var(--verde-d);line-height:1}
  .nota .big.bajo{color:var(--roja-ink)}
  .qrbox{text-align:center}
  .qrbox svg{width:min(78vw,460px);height:auto;background:#fff;padding:14px;border-radius:18px;border:1px solid var(--line)}
  .qrbox .url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:10px}
  table.res{width:100%;border-collapse:collapse;font-size:13.5px}
  table.res th,table.res td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
  table.res td.num{text-align:right;font-variant-numeric:tabular-nums}
  .pbar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;min-width:80px}
  .pbar i{display:block;height:100%;background:var(--verde)}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .tab{font-size:13px;font-weight:700;padding:7px 14px;border-radius:20px;border:1.5px solid var(--verde);color:var(--verde-d);background:#fff}
  .tab.activo{background:var(--verde);color:#fff}
  .op span{color:var(--ink);font-weight:500}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Tarjetas TPM · Tornquist</div>
  <nav></nav>
</div>
<div class="wrap ex">
  <div class="tabs" id="tabs"></div>
  <h1 id="titulo">Examen</h1>
  <p class="sub" id="desc"></p>
  <div id="msg"></div>

  <!-- 1. Quien rinde -->
  <div id="vInicio" class="card" style="display:none">
    <label for="persona"><b>¿Quién sos?</b></label>
    <input id="persona" placeholder="Escribí tu apellido y elegilo de la lista">
    <div class="ayuda">Tu nombre queda registrado con el resultado. No es una contraseña.</div>
    <div style="margin-top:14px"><button class="btn" id="empezar">Empezar</button></div>
  </div>

  <!-- 2. Preguntas -->
  <div id="vPreguntas" style="display:none">
    <div id="lista"></div>
    <div class="barra"><span class="sub" id="faltan" style="margin:0"></span><button class="btn" id="enviar" disabled>Enviar respuestas</button></div>
  </div>

  <!-- 3. Resultado -->
  <div id="vResultado" style="display:none">
    <div class="card nota"><div class="big" id="nota"></div><div class="sub" id="notaTxt" style="margin-top:8px"></div><div id="envio" class="sub"></div></div>
    <h2>Repaso de las respuestas</h2>
    <div id="repaso"></div>
    <div style="margin:18px 0"><button class="btn sec" id="otraVez">Rendir de nuevo</button></div>
  </div>

  <!-- QR para proyectar -->
  <div id="vQR" style="display:none" class="card qrbox">
    <p class="sub" style="font-size:16px;margin-top:0">Escaneá con la cámara del celular y completá el examen</p>
    <div id="qr"></div>
    <div class="url" id="qrUrl"></div>
    <p class="sub" id="qrCuenta" style="font-size:15px"></p>
  </div>

  <!-- Resultados para el instructor -->
  <div id="vResultados" style="display:none">
    <div class="kpis" id="rKpis" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))"></div>
    <h2>Por persona</h2>
    <div class="card" style="overflow-x:auto;padding:6px"><table class="res" id="rTabla"></table></div>
    <h2>Por pregunta</h2>
    <p class="sub" style="margin-top:-6px">Las que tienen menos aciertos son los temas a reforzar.</p>
    <div class="card" style="overflow-x:auto;padding:6px"><table class="res" id="rPregs"></table></div>
  </div>
</div>

<script src="arbol.js"></script>
<script src="personas.js"></script>
<script src="comun.js"></script>
<script src="qrcode.js"></script>
<script src="examenes.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var clave = q.get('e') || 'mp';
  var EX = EXAMENES[clave];
  var modo = q.get('qr') ? 'qr' : (q.get('resultados') ? 'resultados' : 'rendir');
  var respuestas = {}, orden = [];
  var PEND = 'tpm_examen_pend';

  function urlDe(m){ var u = location.origin + location.pathname + '?e=' + encodeURIComponent(clave); return m ? u + '&' + m + '=1' : u; }
  function msg(t, ok){ $('msg').innerHTML = t ? '<div class="msg ' + (ok ? 'ok' : 'err') + '">' + t + '</div>' : ''; }

  if (!EX) { $('titulo').textContent = 'Examen no encontrado'; msg('No existe el examen "' + esc(clave) + '". Revisá el link o el QR.'); return; }
  $('titulo').textContent = 'Examen · ' + EX.titulo;
  $('desc').textContent = EX.desc + ' ' + EX.preguntas.length + ' preguntas.';
  $('tabs').innerHTML = [['rendir', 'Rendir', urlDe()], ['qr', 'QR para proyectar', urlDe('qr')], ['resultados', 'Resultados', urlDe('resultados')]]
    .map(function(t){ return '<a class="tab' + (t[0] === modo ? ' activo' : '') + '" href="' + t[2] + '">' + t[1] + '</a>'; }).join('');

  /* ---------- pendientes sin señal ---------- */
  function pendientes(){ return LS.get(PEND, []); }
  async function enviarPendientes(){
    var p = pendientes(), quedan = [];
    for (var i = 0; i < p.length; i++) {
      try { var r = await api('examen', { data: p[i] }); if (!r.ok) throw new Error(r.error); } catch (e) { quedan.push(p[i]); }
    }
    LS.set(PEND, quedan); return quedan.length;
  }

  /* ---------- rendir ---------- */
  function mezclar(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function pintarPreguntas(){
    orden = EX.preguntas.map(function(p){ return mezclar(p.o); });
    $('lista').innerHTML = EX.preguntas.map(function(p, i){
      return '<div class="preg"><div class="n">Pregunta ' + (i + 1) + ' de ' + EX.preguntas.length + '</div><div class="t">' + esc(p.p) + '</div>' +
        orden[i].map(function(o){ return '<label class="op" data-q="' + i + '"><input type="radio" name="q' + i + '" value="' + o[0] + '"><span>' + esc(o[1]) + '</span></label>'; }).join('') + '</div>';
    }).join('');
    $('lista').querySelectorAll('input').forEach(function(inp){
      inp.addEventListener('change', function(){
        var i = +this.name.slice(1); respuestas[i] = this.value;
        $('lista').querySelectorAll('.op[data-q="' + i + '"]').forEach(function(l){ l.classList.toggle('sel', l.querySelector('input').checked); });
        contar();
      });
    });
    contar();
  }
  function contar(){
    var f = EX.preguntas.length - Object.keys(respuestas).length;
    $('faltan').textContent = f ? 'Faltan ' + f + ' por responder' : 'Todo respondido';
    $('enviar').disabled = f > 0;
  }
  function mostrarResultado(persona, envioOk){
    var bien = 0;
    $('repaso').innerHTML = EX.preguntas.map(function(p, i){
      var r = respuestas[i], ok = r === p.ok; if (ok) bien++;
      return '<div class="preg"><div class="n">Pregunta ' + (i + 1) + (ok ? ' · ✓ correcta' : ' · ✗ incorrecta') + '</div><div class="t">' + esc(p.p) + '</div>' +
        orden[i].map(function(o){
          var cls = o[0] === p.ok ? 'bien' : (o[0] === r ? 'mal' : '');
          return '<div class="op ' + cls + '"><span>' + (o[0] === p.ok ? '✓ ' : (o[0] === r ? '✗ ' : '')) + esc(o[1]) + '</span></div>';
        }).join('') +
        '<div class="expl"><b class="' + (ok ? 'ok' : 'no') + '">' + (ok ? 'Bien.' : 'La correcta es la marcada con ✓.') + '</b> ' + esc(p.ex) + '</div></div>';
    }).join('');
    var tot = EX.preguntas.length, pct = Math.round(bien * 100 / tot);
    $('nota').textContent = bien + ' / ' + tot; $('nota').classList.toggle('bajo', pct < 60);
    $('notaTxt').textContent = persona.split(',').reverse().join(' ').trim() + ' · ' + pct + '% de respuestas correctas';
    $('envio').innerHTML = envioOk ? '✔ Resultado registrado.' : '⏳ Sin conexión: el resultado se envía solo cuando vuelva la señal.';
    return { bien: bien, tot: tot };
  }
  function iniciarRendir(){
    $('vInicio').style.display = '';
    montarBuscadorPersona($('persona'), getYo());
    $('empezar').onclick = function(){
      var v = $('persona').value.trim();
      if (!personaValida(v)) { msg('Elegí tu nombre de la lista (escribí el apellido y tocá tu nombre).'); return; }
      msg(''); if (!getYo()) setYo(v);
      $('vInicio').style.display = 'none'; $('vPreguntas').style.display = '';
      respuestas = {}; pintarPreguntas(); window.scrollTo(0, 0);
    };
    $('enviar').onclick = async function(){
      var persona = $('persona').value.trim(), bien = 0;
      EX.preguntas.forEach(function(p, i){ if (respuestas[i] === p.ok) bien++; });
      var datos = { examen: clave, persona: persona, sector: sectorDe(persona) || '', puntaje: bien, total: EX.preguntas.length,
        respuestas: respuestas, clienteId: Date.now().toString(36) + Math.random().toString(36).slice(2, 8) };
      this.disabled = true; this.textContent = 'Enviando...';
      var ok = false;
      try { var r = await api('examen', { data: datos }); ok = !!r.ok; if (!r.ok) msg('No se pudo registrar: ' + esc(r.error || '')); }
      catch (e) { ok = false; }
      if (!ok) { var p = pendientes(); p.push(datos); LS.set(PEND, p); }
      $('vPreguntas').style.display = 'none'; $('vResultado').style.display = '';
      mostrarResultado(persona, ok); window.scrollTo(0, 0);
      this.disabled = false; this.textContent = 'Enviar respuestas';
    };
    $('otraVez').onclick = function(){ $('vResultado').style.display = 'none'; $('vPreguntas').style.display = ''; respuestas = {}; pintarPreguntas(); window.scrollTo(0, 0); };
  }

  /* ---------- QR para proyectar ---------- */
  async function iniciarQR(){
    $('vQR').style.display = '';
    var u = urlDe(), qr = qrcode(0, 'M'); qr.addData(u); qr.make();
    $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
    $('qrUrl').textContent = u;
    async function cuenta(){
      try { var r = await api('examenes', { examen: clave }); if (r.ok) $('qrCuenta').textContent = r.resultados.length + ' ' + (r.resultados.length === 1 ? 'persona ya respondió' : 'personas ya respondieron'); } catch (e) {}
    }
    cuenta(); setInterval(cuenta, 20000);
  }

  /* ---------- resultados ---------- */
  async function iniciarResultados(){
    $('vResultados').style.display = '';
    var r;
    try { r = await api('examenes', { examen: clave }); } catch (e) { msg('No se pudieron leer los resultados: ' + esc(e.message)); return; }
    if (!r.ok) { msg('No se pudieron leer los resultados: ' + esc(r.error || '')); return; }
    // si alguien rindio dos veces, cuenta el ultimo intento
    var ult = {}; r.resultados.forEach(function(x){ ult[x.Persona] = x; });
    var rs = Object.keys(ult).map(function(k){ return ult[k]; }).sort(function(a, b){ return (b.Porcentaje - a.Porcentaje) || String(a.Persona).localeCompare(b.Persona); });
    if (!rs.length) { $('rKpis').innerHTML = ''; $('rTabla').innerHTML = '<tr><td class="sub">Todavía nadie respondió. Proyectá el QR para que empiecen.</td></tr>'; $('rPregs').innerHTML = ''; return; }
    var prom = Math.round(rs.reduce(function(s, x){ return s + (+x.Porcentaje || 0); }, 0) / rs.length);
    var aprob = rs.filter(function(x){ return +x.Porcentaje >= 70; }).length;
    $('rKpis').innerHTML = '<div class="kpi"><div class="n">' + rs.length + '</div><div class="l">Personas que rindieron</div></div>' +
      '<div class="kpi' + (prom < 60 ? ' rojo' : prom < 70 ? ' amber' : '') + '"><div class="n">' + prom + '%</div><div class="l">Promedio de aciertos</div></div>' +
      '<div class="kpi"><div class="n">' + aprob + '</div><div class="l">Con 70% o más</div></div>';
    $('rTabla').innerHTML = '<tr><th>Persona</th><th>Sector</th><th style="text-align:right">Puntaje</th><th>%</th><th>Fecha</th></tr>' +
      rs.map(function(x){ return '<tr><td>' + esc(x.Persona) + '</td><td>' + esc(x.Sector) + '</td><td class="num">' + x.Puntaje + ' / ' + x.Total + '</td>' +
        '<td><div class="pbar"><i style="width:' + (+x.Porcentaje || 0) + '%;background:' + (+x.Porcentaje < 60 ? 'var(--roja)' : 'var(--verde)') + '"></i></div></td><td>' + esc(x.Fecha) + '</td></tr>'; }).join('');
    $('rPregs').innerHTML = '<tr><th>#</th><th>Pregunta</th><th style="text-align:right">Aciertos</th><th></th></tr>' +
      EX.preguntas.map(function(p, i){
        var n = 0, b = 0; rs.forEach(function(x){ var a = x.Respuestas && x.Respuestas[i]; if (a) { n++; if (a === p.ok) b++; } });
        var pct = n ? Math.round(b * 100 / n) : 0;
        return { i: i, p: p, pct: pct, n: n };
      }).sort(function(a, b){ return a.pct - b.pct; }).map(function(o){
        return '<tr><td>' + (o.i + 1) + '</td><td>' + esc(o.p.p) + '</td><td class="num">' + o.pct + '%</td><td><div class="pbar"><i style="width:' + o.pct + '%;background:' + (o.pct < 60 ? 'var(--roja)' : 'var(--verde)') + '"></i></div></td></tr>';
      }).join('');
  }

  enviarPendientes();
  if (modo === 'qr') iniciarQR(); else if (modo === 'resultados') iniciarResultados(); else iniciarRendir();
})();
</script>
</body>
</html>
