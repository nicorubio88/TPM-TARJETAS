<svg viewBox="0 0 1300 1700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><defs><marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5C6B58"/></marker></defs><rect x="0" y="0" width="1300" height="1700" rx="0" ry="0" fill="#F7F9F4"/><rect x="0" y="0" width="1300" height="130" rx="0" ry="0" fill="#2E4A1C"/><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#FFFFFFB0" text-anchor="start"><tspan x="40" dy="0">SISTEMA DE TARJETAS TPM</tspan></text><text x="40" y="92" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#fff" text-anchor="start"><tspan x="40" dy="0">Cómo funciona el sistema · Planta Tornquist</tspan></text><text x="1260" y="100" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#FFFFFFCC" text-anchor="end"><tspan x="1260" dy="0">El que opera el equipo es quien mejor lo conoce</tspan></text><rect x="60" y="170" width="1180" height="74" rx="14" ry="14" fill="#FFFFFF" stroke="#D8E0CE" stroke-width="1.6"/><text x="78" y="200" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="78" dy="0">1. Detectás algo en el equipo</tspan></text><text x="78" y="224" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="78" dy="0">Un ruido, una fuga, algo flojo, suciedad, un lugar difícil de limpiar, una idea de mejora...</tspan></text><line x1="650.0" y1="244" x2="650.0" y2="282" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><polygon points="650.0,282 950.0,346.0 650.0,410 350.0,346.0" fill="#E7F2DC" stroke="#3D5F26" stroke-width="2"/><text x="650.0" y="339.0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="650.0" dy="0">2. ¿Quién lo puede resolver?</tspan></text><text x="650.0" y="361.0" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="middle"><tspan x="650.0" dy="0">esa respuesta define el color de la tarjeta</tspan></text><path d="M 650.0 410 Q 390.0 390 250.0 446" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="650.0" y1="410" x2="660.0" y2="446" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 650.0 410 Q 909.9999999999999 390 1070.0 446" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="450" width="380" height="250" rx="18" ry="18" fill="#FFFFFF" stroke="#B8402A" stroke-width="2"/><rect x="80" y="468" width="340" height="27" rx="13.5" ry="13.5" fill="#B8402A"/><text x="250.0" y="485.92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="250.0" dy="0">TARJETA ROJA</tspan></text><text x="250.0" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#8A2E1C" text-anchor="middle"><tspan x="250.0" dy="0">Hace falta un técnico</tspan></text><text x="80" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="80" dy="0">Requiere expertise: eléctrico,</tspan><tspan x="80" dy="16">mecánico o instrumentista</tspan></text><rect x="78" y="582" width="344" height="32" rx="9" ry="9" fill="#FBE6E1"/><text x="250.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#8A2E1C" text-anchor="middle"><tspan x="250.0" dy="0">→ La resuelve MANTENIMIENTO</tspan></text><text x="80" y="636" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="80" dy="0">Ej: rodamiento ruidoso, falla eléctrica,</tspan><tspan x="80" dy="15">fuga que necesita soldadura</tspan></text><rect x="470" y="450" width="380" height="250" rx="18" ry="18" fill="#FFFFFF" stroke="#3E5C9A" stroke-width="2"/><rect x="490" y="468" width="340" height="27" rx="13.5" ry="13.5" fill="#3E5C9A"/><text x="660.0" y="485.92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="660.0" dy="0">TARJETA AZUL</tspan></text><text x="660.0" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#2E4470" text-anchor="middle"><tspan x="660.0" dy="0">Lo puedo resolver yo</tspan></text><text x="490" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="490" dy="0">Baja complejidad técnica,</tspan><tspan x="490" dy="16">lo hace el operador del sector</tspan></text><rect x="488" y="582" width="344" height="32" rx="9" ry="9" fill="#E6ECFA"/><text x="660.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#2E4470" text-anchor="middle"><tspan x="660.0" dy="0">→ La resuelve OPERACIÓN</tspan></text><text x="490" y="636" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="490" dy="0">Ej: limpiar suciedad, apretar un perno flojo,</tspan><tspan x="490" dy="15">completar nivel de aceite accesible</tspan></text><rect x="880" y="450" width="380" height="250" rx="18" ry="18" fill="#FFFFFF" stroke="#548235" stroke-width="2"/><rect x="900" y="468" width="340" height="27" rx="13.5" ry="13.5" fill="#548235"/><text x="1070.0" y="485.92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="1070.0" dy="0">TARJETA VERDE</tspan></text><text x="1070.0" y="522" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="1070.0" dy="0">Es una idea de mejora</tspan></text><text x="900" y="548" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#5C6B58" text-anchor="start"><tspan x="900" dy="0">No es una falla: es una forma</tspan><tspan x="900" dy="16">de que funcione mejor</tspan></text><rect x="898" y="582" width="344" height="32" rx="9" ry="9" fill="#E7F2DC"/><text x="1070.0" y="603" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="800" fill="#3D5F26" text-anchor="middle"><tspan x="1070.0" dy="0">→ Va a MEJORA ENFOCADA</tspan></text><text x="900" y="636" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="900" dy="0">Ej: facilitar un acceso, eliminar una fuente</tspan><tspan x="900" dy="15">de suciedad, reducir un tiempo</tspan></text><path d="M 250.0 722 Q 250.0 752 646.0 752" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="660.0" y1="722" x2="650.0" y2="752" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><path d="M 1070.0 722 Q 1070.0 752 654.0 752" fill="none" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><line x1="650.0" y1="752" x2="650.0" y2="788" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="788" width="1180" height="152" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6"/><circle cx="88" cy="816" r="15" fill="#3D5F26"/><text x="88" y="821" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">3</tspan></text><text x="112" y="818" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Cargás la tarjeta</tspan></text><circle cx="90" cy="845" r="3" fill="#548235"/><text x="105" y="850" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Quién la detecta y en qué turno</tspan></text><circle cx="90" cy="868" r="3" fill="#548235"/><text x="105" y="873" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Dónde: área → subárea → equipo (el árbol de la planta)</tspan></text><circle cx="90" cy="891" r="3" fill="#548235"/><text x="105" y="896" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Qué encontraste: una de las 7 categorías de anomalía</tspan></text><circle cx="90" cy="914" r="3" fill="#548235"/><text x="105" y="919" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="400" fill="#20291F" text-anchor="start"><tspan x="105" dy="0">Descripción, foto y prioridad</tspan></text><line x1="650.0" y1="940" x2="650.0" y2="974" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="974" width="1180" height="86" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6"/><circle cx="88" cy="1002" r="15" fill="#3D5F26"/><text x="88" y="1007" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">4</tspan></text><text x="112" y="1004" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Se asigna sola, por el color</tspan></text><text x="112" y="1028" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">No hace falta que decidas a quién mandársela: el sistema la manda al grupo</tspan><tspan x="112" dy="17">que corresponde según el color que elegiste.</tspan></text><line x1="650.0" y1="1060" x2="650.0" y2="1094" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="1094" width="1180" height="86" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6"/><circle cx="88" cy="1122" r="15" fill="#3D5F26"/><text x="88" y="1127" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">5</tspan></text><text x="112" y="1124" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Seguimiento</tspan></text><text x="112" y="1148" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Se le pone responsable y fecha compromiso. El tablero muestra todo por</tspan><tspan x="112" dy="17">prioridad y estado — las vencidas se marcan en rojo.</tspan></text><line x1="650.0" y1="1180" x2="650.0" y2="1214" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="1214" width="1180" height="86" rx="14" ry="14" fill="#FFFFFF" stroke="#3D5F26" stroke-width="1.6"/><circle cx="88" cy="1242" r="15" fill="#3D5F26"/><text x="88" y="1247" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle"><tspan x="88" dy="0">6</tspan></text><text x="112" y="1244" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#20291F" text-anchor="start"><tspan x="112" dy="0">Cierre</tspan></text><text x="112" y="1268" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#5C6B58" text-anchor="start"><tspan x="112" dy="0">Se registra qué se hizo para resolverla y el costo si lo hubo.</tspan><tspan x="112" dy="17">La tarjeta cerrada queda como historial del equipo.</tspan></text><line x1="650.0" y1="1300" x2="650.0" y2="1336" stroke="#5C6B58" stroke-width="2.6" marker-end="url(#ah)"/><rect x="60" y="1336" width="1180" height="92" rx="16" ry="16" fill="#E7F2DC" stroke="#D6EAC4" stroke-width="1.6"/><text x="88" y="1368" font-family="Arial, Helvetica, sans-serif" font-size="14.5" font-weight="800" fill="#3D5F26" text-anchor="start"><tspan x="88" dy="0">¿Y si el problema se repite?</tspan></text><text x="88" y="1392" font-family="Arial, Helvetica, sans-serif" font-size="12.8" font-weight="400" fill="#3D5F26" text-anchor="start"><tspan x="88" dy="0">Si la misma tarjeta vuelve a aparecer una y otra vez, no alcanza con resolverla: hay una causa de fondo.</tspan><tspan x="88" dy="17">Ahí corresponde abrir un análisis en el sistema de Causa Raíz.</tspan></text><rect x="0" y="1458" width="1300" height="242" rx="0" ry="0" fill="#2E4A1C"/><text x="650.0" y="1498" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="650.0" dy="0">Cada anomalía que registrás es una parada que no va a ocurrir</tspan></text><text x="650.0" y="1526" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="500" fill="#FFFFFFB0" text-anchor="middle"><tspan x="650.0" dy="0">Planta Tornquist · Papelera del Sur — Grupo H. Koch · Mantenimiento Autónomo</tspan></text></svg>